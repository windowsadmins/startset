name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  DOTNET_VERSION: '10.0.x'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  TZ: 'America/Vancouver'

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~\.nuget\packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', '**/Directory.Packages.props') }}

      - name: Derive version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v',''
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build + package (unsigned)
        shell: pwsh
        run: .\build.ps1 -NoSign

      - name: Collect release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-out -Force | Out-Null
          if (Test-Path release) {
            Get-ChildItem release -Recurse -File -Include *.msi,*.nupkg,*.pkg,*.intunewin,*.zip |
              ForEach-Object { Copy-Item $_.FullName "release-out/" -Force }
          }
          Get-ChildItem release-out | Format-Table Name, Length

      - name: Prepare release zips
        shell: pwsh
        run: |
          foreach ($arch in @("x64", "arm64")) {
            $binDir = "release/$arch"
            if (-not (Test-Path "$binDir/StartSetService.exe")) { throw "Binaries not found in $binDir" }
            Compress-Archive -Path "$binDir/*.exe" -DestinationPath "release-out/startset-$arch.zip" -Force
          }

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ github.ref_name }}'
          $title = "StartSet $tag"
          $dotnet = (dotnet --version).Trim()
          $os = (Get-CimInstance Win32_OperatingSystem).Caption.Trim()
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"

          $buildInfo = @"
          ## Build info

          This release was built with .NET SDK $dotnet on $os, via a GitHub Actions workflow here: $runUrl. It is provided **unsigned** — see signing instructions at the bottom.
          "@

          $signing = @"
          ## Signing for enterprise deployment

          Sign the binaries and MSIs with your organization's code signing certificate before distribution:

          ``````powershell
          `$cert = "Your Certificate Name"
          `$timestampUrl = "http://timestamp.digicert.com"

          # Sign all binaries (run after extracting any zipped payload)
          Get-ChildItem -Recurse -Include *.exe,*.dll | ForEach-Object {
              signtool sign /fd SHA256 /tr `$timestampUrl /td SHA256 /n `$cert `$_.FullName
          }

          # Sign the MSI installers (run separately, after binaries are signed and repackaged)
          Get-ChildItem -Filter "StartSet-*.msi" | ForEach-Object {
              signtool sign /fd SHA256 /tr `$timestampUrl /td SHA256 /n `$cert `$_.FullName
          }
          ``````

          Built from commit ``$env:GITHUB_SHA``.
          "@

          $autoNotes = (gh api -X POST "repos/$env:GITHUB_REPOSITORY/releases/generate-notes" -f tag_name=$tag --jq .body) -join "`n"
          $autoNotes = ($autoNotes -join "`n") -replace ' by @[\w-]+ in ', ' in '
          $autoNotes = ($autoNotes -split "`n" | Where-Object { $_ -notmatch '^#+ New Contributors' -and $_ -notmatch 'made their first contribution' }) -join "`n"
          $notes = "$buildInfo`n`n$autoNotes`n`n$signing"

          $artifacts = Get-ChildItem -Path release-out -File | ForEach-Object { $_.FullName }
          if ($artifacts.Count -eq 0) { throw 'No artifacts to upload' }
          gh release create $tag @artifacts --title $title --notes $notes
