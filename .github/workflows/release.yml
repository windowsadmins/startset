name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  DOTNET_VERSION: '10.0.x'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  TZ: 'America/Vancouver'
  # The highest version already deployed. A release below it would be seen as a downgrade.
  MINIMUM_FILE_VERSION: '2026.9.11.725'

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~\.nuget\packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', '**/Directory.Packages.props') }}

      - name: Derive version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v',''
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # Every file is stamped with the tag's version. Deployment tools compare file versions
      # with what is installed, so a release must never carry one lower than the fleet's.
      - name: Build binaries (unsigned)
        shell: pwsh
        run: .\build.ps1 -NoSign -Binaries -BuildVersion '${{ steps.version.outputs.version }}'

      - name: Check file versions
        shell: pwsh
        run: |
          $parts = '${{ steps.version.outputs.version }}'.Split('.') | ForEach-Object { [int]$_ }
          $expected = [version]::new($parts[0], $parts[1], $parts[2], $parts[3])
          $floor = [version]'${{ env.MINIMUM_FILE_VERSION }}'
          if ($expected -lt $floor) { throw "Tag version $expected is below the fleet's $floor" }
          foreach ($arch in @("x64", "arm64")) {
            foreach ($exe in @("release/$arch/managedstatekeeper.exe", "release/$arch/StartSetService.exe", "release/$arch/gui/Managed State Keeper.exe")) {
              $actual = [version](Get-Item -LiteralPath $exe).VersionInfo.FileVersion
              if ($actual -ne $expected) { throw "$exe is $actual, expected $expected" }
              "$exe $actual"
            }
          }

      - name: Collect release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-out -Force | Out-Null
          if (Test-Path release) {
            Get-ChildItem release -Recurse -File -Include *.msi,*.nupkg,*.pkg,*.intunewin,*.zip |
              ForEach-Object { Copy-Item $_.FullName "release-out/" -Force }
          }
          Get-ChildItem release-out | Format-Table Name, Length

      # startset-<arch>.zip is the install payload, laid out as build-info.yaml installs it
      # into C:\Program Files\StartSet: the CLI and service, and beside them the whole
      # Managed State Keeper publish output (its exe, resources.pri, the compiled XAML and
      # the Windows App SDK runtime files and folders).
      - name: Prepare release zips
        shell: pwsh
        run: |
          foreach ($arch in @("x64", "arm64")) {
            $binDir = "release/$arch"
            $guiDir = "$binDir/gui"
            foreach ($required in @("$binDir/managedstatekeeper.exe", "$binDir/StartSetService.exe", "$guiDir/Managed State Keeper.exe", "$guiDir/resources.pri")) {
              if (-not (Test-Path -LiteralPath $required)) { throw "Missing from the build: $required" }
            }
            $stage = "zip-stage/$arch"
            New-Item -ItemType Directory -Path $stage -Force | Out-Null
            Copy-Item "$binDir/*.exe" $stage -Force
            Copy-Item "$guiDir/*" $stage -Recurse -Force
            Compress-Archive -Path "$stage/*" -DestinationPath "release-out/startset-$arch.zip" -Force
            $count = (Get-ChildItem $stage -Recurse -File).Count
            "startset-$arch.zip: $count files"
          }

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ github.ref_name }}'
          $title = "StartSet $tag"
          $dotnet = (dotnet --version).Trim()
          $os = (Get-CimInstance Win32_OperatingSystem).Caption.Trim()
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"

          $buildInfo = @"
          ## Build info

          This release was built with .NET SDK $dotnet on $os, via a GitHub Actions workflow here: $runUrl. It is provided **unsigned** — see signing instructions at the bottom.
          "@

          $signing = @"
          ## Signing for enterprise deployment

          Sign the binaries and MSIs with your organization's code signing certificate before distribution:

          ``````powershell
          `$cert = "Your Certificate Name"
          `$timestampUrl = "http://timestamp.digicert.com"

          # Sign all binaries (run after extracting any zipped payload)
          Get-ChildItem -Recurse -Include *.exe,*.dll | ForEach-Object {
              signtool sign /fd SHA256 /tr `$timestampUrl /td SHA256 /n `$cert `$_.FullName
          }

          # Sign the MSI installers (run separately, after binaries are signed and repackaged)
          Get-ChildItem -Filter "StartSet-*.msi" | ForEach-Object {
              signtool sign /fd SHA256 /tr `$timestampUrl /td SHA256 /n `$cert `$_.FullName
          }
          ``````

          Built from commit ``$env:GITHUB_SHA``.
          "@

          $autoNotes = (gh api -X POST "repos/$env:GITHUB_REPOSITORY/releases/generate-notes" -f tag_name=$tag --jq .body) -join "`n"
          $autoNotes = ($autoNotes -join "`n") -replace ' by @[\w-]+ in ', ' in '
          $autoNotes = ($autoNotes -split "`n" | Where-Object { $_ -notmatch '^#+ New Contributors' -and $_ -notmatch 'made their first contribution' }) -join "`n"
          $notes = "$buildInfo`n`n$autoNotes`n`n$signing"

          $artifacts = Get-ChildItem -Path release-out -File | ForEach-Object { $_.FullName }
          if ($artifacts.Count -eq 0) { throw 'No artifacts to upload' }
          gh release create $tag @artifacts --title $title --notes $notes
